[package]
name = "cargo-varies"
version = "0.1.0"
edition = "2024"
description = "Synthesize unsafe-wrapper verification suites for Rust library crates"
repository = "https://github.com/huanli-00/cargo-varies"
license = "MPL-2.0"
readme = "README.md"
publish = false
build = "build.rs"

[[bin]]
name = "cargo-varies"
path = "src/main.rs"

[lib]
name = "varies"
path = "src/lib.rs"

[dependencies]
log = "0.4.28"
anyhow = "1.0.100"
clap = { version = "4.5.60", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
shlex = "1.3.0"
wait-timeout = "0.2.1"

[dev-dependencies]
tempfile = "3.23.0"

[package.metadata.rust-analyzer]
rustc_private = true
